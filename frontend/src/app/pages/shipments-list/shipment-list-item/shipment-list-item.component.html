<div class="list-item">
  <div class="list-item--content">
    <span><b>#{{ item.id }}</b></span>
  </div>
  <div>
    {{ item.createdAt | date: 'medium' }}
  </div>
  <span>{{totalItemCount}}x</span>
  <span>{{ item.totalAmount | currency:'EUR' }}</span>
  <app-button text="Delete" icon="delete" (click)="onItemDelete.emit(item)"></app-button>
</div>
