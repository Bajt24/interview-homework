<div class="list-item">
  <div class="list-item--image" *ngIf="item.imageUrl">
    <img [src]="item.imageUrl" alt="warehouse-item-image">
  </div>
  <div class="list-item--content">
    <span><b>{{ item.name }}</b></span>
    <span>{{ item.description }}</span>
  </div>
  <span>{{ item.quantity }}x</span>
  <span>{{ item.unitPrice | currency:'EUR' }}</span>
  <input type="number" value="0" step="1" [ngModel]="selectedQuantity" (ngModelChange)="onQuantityChange($event)"
         [attr.max]="item.quantity" min="0" [disabled]="!item.quantity">
  <app-button text="Add to shipment" icon="add_shopping_cart" (click)="addSelectedQuantity()"
              [disabled]="!item.quantity || selectedQuantity === item.quantity"></app-button>
  <app-button text="Edit" icon="edit" (click)="onItemEdit.emit(item.id)" [disabled]="!!selectedQuantity"></app-button>
  <app-button text="Delete" icon="delete" (click)="onItemDelete.emit(item)"
              [disabled]="!!selectedQuantity"></app-button>
</div>
