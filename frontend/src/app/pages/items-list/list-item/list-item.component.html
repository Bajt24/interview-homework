<div class="list-item">
  <div class="list-item--image" *ngIf="item.imageUrl">
    <img [src]="item.imageUrl" alt="warehouse-item-image">
  </div>
  <div class="list-item--content">
    <span><b>{{ item.name }}</b></span>
    <span>{{ item.description }}</span>
  </div>
  <span>{{ item.quantity }}x</span>
  <span>{{ item.unitPrice | currency:'EUR' }}</span>
  <app-button text="Add to shipment" icon="add_shopping_cart"></app-button>
  <app-button text="Edit" icon="edit" (click)="onItemEdit.emit(item.id)"></app-button>
  <app-button text="Delete" icon="delete" (click)="onItemDelete.emit(item)"></app-button>
</div>
